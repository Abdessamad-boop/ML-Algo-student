name: Checkpoints

on:
  push:
    paths:
      - "exercises_with_checks/**"
  workflow_dispatch:

jobs:
  checkpoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - week: week01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pytest nbformat nbclient ipykernel scikit-learn pandas numpy

      - name: Run checkpoint ${{ matrix.week }}
        run: pytest exercises_with_checks/checks/test_${{ matrix.week }}_knn.py -v --tb=short
