<h2 id="wat-is-scikit-learn">Wat is scikit-learn?</h2>
<ul>
<li><strong>Bekendste ML-bibliotheek</strong> voor Python — gebouwd op NumPy &amp; SciPy</li>
<li><strong>Wat kan het?</strong>
<ul>
<li>Classificatie (o.a. Naive Bayes, KNN, SVM, …)</li>
<li>Regressie</li>
<li>Clustering</li>
<li>Dimensionality reduction</li>

<li>Model selectie &amp; evaluatie (cross-validatie, metrics)</li>
</ul>
</li>
</ul>

<li><strong>Open source</strong> (BSD-licentie) — gratis, ook voor commercieel gebruik
<ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="consistent-api-%C3%A9%C3%A9n-patroon-voor-%C3%A9lk-algoritme">Consistent API: één patroon voor élk algoritme</h2>
<p>Elk schattingsalgoritme (&quot;estimator&quot;) in scikit-learn volgt dezelfde structuur:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.xxxx <span class="hljs-keyword">import</span> SomeModel

model = SomeModel(hyperparameter=waarde)  <span class="hljs-comment"># 1. Maak model</span>
model.fit(X, y)                          <span class="hljs-comment"># 2. Leer uit data</span>
model.predict(X_new)                     <span class="hljs-comment"># 3. Voorspel</span>
model.score(X_test, y_test)              <span class="hljs-comment"># 4. Evalueer</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart LR
    A[&quot;Model maken&quot;] --&gt; B[&quot;.fit(X, y)&quot;]
    B --&gt; C[&quot;.predict(X_new)&quot;]
    C --&gt; D[&quot;.score(X_test, y_test)&quot;]
</code></pre>
<blockquote>
<p><strong>Waarom?</strong> Eén patroon leren = <strong>alle</strong> algoritmes in deze cursus kunnen gebruiken!</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="en-nog-meer-herbruikbare-methodes">... en nog meer herbruikbare methodes</h2>
<table>
<thead>
<tr>
<th>Methode</th>
<th>Gebruik</th>
<th>Voorbeeld</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>.fit(X, y)</code></td>
<td>Train het model</td>
<td><code>knn.fit(X_train, y_train)</code></td>
</tr>
<tr>
<td><code>.predict(X)</code></td>
<td>Voorspel labels</td>
<td><code>knn.predict(X_test)</code></td>
</tr>
<tr>
<td><code>.score(X, y)</code></td>
<td>Bereken nauwkeurigheid</td>
<td><code>knn.score(X_test, y_test)</code></td>
</tr>
<tr>
<td><code>.transform(X)</code></td>
<td>Transformeer data (preprocessing)</td>
<td><code>scaler.transform(X_test)</code></td>
</tr>
<tr>
<td><code>.fit_transform(X)</code></td>
<td>Fit + transform in één stap</td>
<td><code>scaler.fit_transform(X_train)</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>Opgelet:</strong> <code>.fit()</code> en <code>.predict()</code> zijn <strong>altijd</strong> beschikbaar voor supervised modellen; <code>.transform()</code> enkel voor preprocessing / unsupervised.</p>
</blockquote>
</section>

<h2 id="naive-bayes">Naive Bayes</h2>
<p>Een eerste classifier</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="naive-bayes--historische-noot">Naive Bayes — historische noot</h2>
<ul>
<li><strong>Thomas Bayes (1701–1761)</strong> — Engelse predikant en wiskundige
<ul>
<li>Zijn stelling werd <strong>postuum</strong> gepubliceerd in 1763 door zijn vriend Richard Price</li>
</ul>
</li>
<li><strong>Pierre-Simon Laplace (1749–1827)</strong> — Franse wiskundige
<ul>
<li>Herontdekte en generaliseerde Bayes' werk onafhankelijk → <strong>Bayes–Laplace-stelling</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<ul>
<li><strong>Eerste ML-toepassing:</strong> M.E. Maron (1961) gebruikte Naive Bayes voor automatische indexering van documenten
<ul>
<li><a href="https://doi.org/10.1145/321075.321084">doi.org/10.1145/321075.321084</a></li>
</ul>
</li>
<li><strong>Spamfilter-revolutie (jaren 1990–2000):</strong> Naive Bayes werd de standaard voor e-mail filtering
<ul>
<li>Sahami et al., 1998: <a href="https://www.aaai.org/Papers/Workshops/1998/WS-98-05/WS98-05-004.pdf">aaai.org/Papers/Workshops/1998/WS-98-05/WS98-05-004.pdf</a></li>
<li>Graham, 2002: <a href="https://paulgraham.com/spam.html">paulgraham.com/spam.html</a></li>
</ul>
</li>
<li><strong>Waarom &quot;naief&quot;?</strong> — De aanname van onafhankelijkheid is al sinds de jaren 1960 gekend als <em>onrealistisch</em>, toch blijft de classifier verrassend goed presteren <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/></li>
</ul>
</section>

<h2 id="k-nearest-neighbours-knn">K-Nearest Neighbours (KNN)</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="knn--historische-noot">KNN — historische noot</h2>
<ul>
<li><strong>Fix &amp; Hodges (1951)</strong> — Eerste beschrijving van het &quot;nearest neighbor&quot;-beslissingsregel
<ul>
<li>US Air Force technisch rapport: een <strong>niet-parametrische</strong> classifier — geen aannames over de onderliggende verdeling</li>
<li>Zie: <a href="https://en.wikipedia.org/wiki/K-nearest_neighbors_algorithm">en.wikipedia.org/wiki/K-nearest_neighbors_algorithm</a></li>
</ul>
</li>
<li><strong>Cover &amp; Hart (1967)</strong> — Baanbrekend artikel &quot;Nearest neighbor pattern classification&quot;</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<ul>
<li>Bewezen: met voldoende data is de fout van 1-NN <strong>hoogstens 2× de Bayes-optimale fout</strong></li>
<li><a href="https://doi.org/10.1109/TIT.1967.1053964">doi.org/10.1109/TIT.1967.1053964</a></li>
<li><strong>&quot;Lazy learning&quot;</strong> — al in de jaren 1950 gekend: geen echte trainingsfase, alle data wordt opgeslagen</li>
<li><strong>1990–2010</strong> — KNN breed toegepast in patroonherkenning, beeldclassificatie en aanbevelingssystemen (collaborative filtering)</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> KNN is één van de <strong>oudste</strong> en <strong>simpelste</strong> ML-algoritmes — maar nog steeds relevant!</p>
</blockquote>
</section>

<li>Het <strong>meest voorkomende label</strong> van die <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> punten = voorspelling</li>
</ul>
</li>

<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> Training kost nauwelijks tijd — maar <strong>classificatie is traag</strong> (veel afstanden berekenen)</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart TD

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="knn--eigenschappen-1">KNN — Eigenschappen (1)</h2>
<ul>
<li><strong>Supervised learning</strong> — zowel binary als multiclass</li>
<li>Werkt <strong>enkel</strong> als er een notie van <strong>afstand</strong> is tussen datapunten</li>
<li><strong>Numerieke data:</strong> normaliseren is <strong>verplicht!</strong>
<ul>
<li>Anders krijgen features met grote waarden onbedoeld meer gewicht</li>
</ul>
</li>
<li><strong>Categorische data:</strong> zelf een metriek definiëren
<ul>
<li>Bv. vogelvluchtafstand tussen steden, of <strong>one-hot encoding</strong></li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">
<h2 id="knn--eigenschappen-2">KNN — Eigenschappen (2)</h2>
<ul>
<li>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> moet <strong>op voorhand</strong> gekozen worden</p>
<ul>
<li>Te kleine <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> → gevoelig voor ruis (overfitting)</li>
<li>Te grote <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> → te veel middeling (underfitting)</li>
<li><strong>Oplossing:</strong> kies <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> via <strong>cross-validatie</strong></li>
</ul>
</li>
<li>
<p><strong>Training:</strong> goedkoop (enkel data opslaan) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></p>
</li>
<li>
<p><strong>Classificatie:</strong> duur (alle afstanden berekenen) <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></p>
</li>
</ul>
<blockquote>
<p>KNN is een <strong>lazy learner</strong> — er is geen echte trainingsfase.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">

<p><img src="images/Slides_ML_Algorithms_les1_p20_img001.jpeg" alt="" /></p>
<ul>
<li><strong><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.327ex" height="1.756ex" role="img" focusable="false" viewBox="0 -694 2354.6 776"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D458" d="M121 647Q121 657 125 670T137 683Q138 683 209 688T282 694Q294 694 294 686Q294 679 244 477Q194 279 194 272Q213 282 223 291Q247 309 292 354T362 415Q402 442 438 442Q468 442 485 423T503 369Q503 344 496 327T477 302T456 291T438 288Q418 288 406 299T394 328Q394 353 410 369T442 390L458 393Q446 405 434 405H430Q398 402 367 380T294 316T228 255Q230 254 243 252T267 246T293 238T320 224T342 206T359 180T365 147Q365 130 360 106T354 66Q354 26 381 26Q429 26 459 145Q461 153 479 153H483Q499 153 499 144Q499 139 496 130Q455 -11 378 -11Q333 -11 305 15T277 90Q277 108 280 121T283 145Q283 167 269 183T234 206T200 217T182 220H180Q168 178 159 139T145 81T136 44T129 20T122 7T111 -2Q98 -11 83 -11Q66 -11 57 -1T48 16Q48 26 85 176T158 471L195 616Q196 629 188 632T149 637H144Q134 637 131 637T124 640T121 647Z"></path></g><g data-mml-node="mo" transform="translate(798.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(1854.6,0)"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path></g></g></g></svg></mjx-container></strong></li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="ap-theme" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:ap-theme;" data-marpit-pagination-total="35">

<p><strong>Optie 1 — Zelf implementeren (zie labo)</strong></p>
<p><strong>Optie 2 — Scikit-learn:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.neighbors <span class="hljs-keyword">import</span> KNeighborsClassifier

</code></pre>

<ul>
